name: Deploy to Nekoweb

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nekoweb-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    name: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build site
        run: python3 static_site_generator.py

      - name: Check build output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Build output differs from committed files." >&2
            echo "Run python3 static_site_generator.py and commit the result." >&2
            git status --porcelain
            exit 1
          fi

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    name: deploy2nekoweb
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 static_site_generator.py

      - name: deploy2nekoweb
        uses: indiefellas/deploy2nekoweb@main
        with:
          nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
          nekoweb-domain: 'michael.nekoweb.org'
          nekoweb-username: 'michael'
          directory: 'public'

      # deploy2nekoweb deletes the whole remote site before re-uploading, and
      # swallows upload errors while still exiting 0 (green run, empty site).
      # Fail loudly if the homepage doesn't come back after a deploy.
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null https://michael.nekoweb.org/; then
              echo "Site is up."
              exit 0
            fi
            echo "Attempt $i failed, waiting 20s for Nekoweb to serve fresh files..."
            sleep 20
          done
          echo "Homepage did not come back after deploy." >&2
          exit 1